{% include base_path %}

<!-- start custom head snippets -->

<!-- Theme bootstrap: applies the saved theme before first paint so the page never flashes the
     wrong colours. The site has historically always been dark, so dark is the fallback when
     nothing has been stored yet (the toggle in the masthead still lets visitors switch). -->
<script>
  (function () {
    var stored = localStorage.getItem("theme");
    var theme = (stored === "light" || stored === "dark") ? stored : "dark";
    if (theme === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Site-specific overrides (footer layout for the visitor tracker, etc.) -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/custom.css"/>

<!-- Favicons / web app manifest -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/favicon.ico"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.ico"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico"/>
<meta name="msapplication-TileColor" content="#474747">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml">
<meta name="theme-color" content="#474747">

<!-- Support for MathJax -->
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- end custom head snippets -->
